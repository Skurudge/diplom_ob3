[project]
name = "diplom-ob3"
version = "0.1.0"
description = "Дипломный проект OB3: Сервис обработки загружаемых документов"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = "^3.13"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "stripe (>=15.2.0,<16.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "drf-spectacular-sidecar (>=2026.6.1,<2027.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "redis (<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py313']
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
skip = ["migrations", ".venv"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["venv", ".venv", "migrations"]

[dependency-groups]
dev = [
    "django-stubs (>=6.0.5,<7.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "coverage (>=7.14.1,<8.0.0)"
]

[tool.poetry]
package-mode = false
